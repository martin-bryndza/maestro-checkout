appId: com.ventrata.maestro_booking_demo
name: Validations & Selection Resets Check in Purchase Flow
tags:
  - regression
---
# -----------------------------------------------------------------------------
# Maestro Test: Validations & Selection Resets Flow
# -----------------------------------------------------------------------------

- runScript: ./pages/TicketsPage.js
- runScript: ./pages/DateTimePage.js
- runScript: ./pages/QuestionsPage.js
- runScript: ./pages/CheckoutPage.js
- runScript: ./pages/PaymentPage.js


- launchApp:
    clearState: true

# -----------------------------------------------------------------------------
# STEP 1: Ticket Quantity Validation Rule
# -----------------------------------------------------------------------------
- runFlow: subflows/select_package.yaml

# Increment Child without an Adult -> Child requires adult error must appear
- tapOn:
    id: "${output.TicketsPage.childIncrement}"

- assertVisible:
    id: "${output.TicketsPage.childRequiresAdultError}"

# Add Adult ticket -> Error must disappear
- tapOn:
    id: "${output.TicketsPage.adultIncrement}"

- assertNotVisible:
    id: "${output.TicketsPage.childRequiresAdultError}"

- tapOn:
    id: "${output.TicketsPage.continueButton}"

- extendedWaitUntil:
    visible:
      id: "${output.DateTimePage.page}"
    timeout: 15000

# -----------------------------------------------------------------------------
# STEP 2: Date & Time Selection & Reset Selection Rule
# -----------------------------------------------------------------------------
# Select initial dates & times using subflow
- runFlow:
    file: subflows/select_date_and_time.yaml
    env:
      CALENDAR_DAY: 15
      TIMESLOT: "12_00"

# Navigate back to DateTime page to assert Reset Selection
- back

- assertVisible:
    id: "${output.DateTimePage.resetSelectionLink}"

- tapOn:
    id: "${output.DateTimePage.resetSelectionLink}"

- assertNotVisible:
    id: "${output.DateTimePage.confirmedDate(0)}"

- assertNotVisible:
    id: "${output.DateTimePage.confirmedDate(1)}"

- assertNotVisible:
    id: "${output.DateTimePage.confirmedDate(3)}"

# Re-select required dates & times using subflow
- runFlow:
    file: subflows/select_date_and_time.yaml
    env:
      CALENDAR_DAY: 15
      TIMESLOT: "12_00"

# -----------------------------------------------------------------------------
# STEP 3: Questions Page Validation
# -----------------------------------------------------------------------------
# Try to continue with empty required fields -> Validation error must block user
- tapOn:
    id: "${output.QuestionsPage.continueButton}"

- assertVisible:
    id: "${output.QuestionsPage.validationError}"

- assertVisible:
    id: "${output.QuestionsPage.page}"

# Fill required fields using subflow (2 tickets: 1 adult + 1 child)
- runFlow:
    file: subflows/fill_questions.yaml
    env:
      ARRIVAL_TEXT: "Metro"
      REFERRAL_OPTION: "Od přátel nebo rodiny"
      TICKET_COUNT: 2

# -----------------------------------------------------------------------------
# STEP 4: Checkout Contact & Payment Validation
# -----------------------------------------------------------------------------
# Try to confirm order without contact details -> Field errors must appear
- tapOn:
    id: "${output.CheckoutPage.payOrConfirmButton}"

- assertVisible:
    id: "${output.CheckoutPage.firstNameError}"

- assertVisible:
    id: "${output.CheckoutPage.lastNameError}"

- assertVisible:
    id: "${output.CheckoutPage.countryError}"

- assertVisible:
    id: "${output.CheckoutPage.stateProvinceError}"

# Fill contact details using subflow
- runFlow:
    file: subflows/fill_checkout_contact.yaml
    env:
      FIRST_NAME: "Jan"
      LAST_NAME: "Novák"
      STATE_PROVINCE: "JMK"

- assertVisible:
    id: "${output.CheckoutPage.payOrConfirmButton}"

# Proceed to Payment Screen (without promo code)
- tapOn:
    id: "${output.CheckoutPage.payOrConfirmButton}"

- extendedWaitUntil:
    visible:
      id: "${output.PaymentPage.page}"
    timeout: 15000

- tapOn:
    id: "${output.PaymentPage.payButton}"

- assertVisible:
    id: "${output.PaymentPage.cardNumberError}"

- assertVisible:
    id: "${output.PaymentPage.expiryError}"

- assertVisible:
    id: "${output.PaymentPage.cvcError}"

- assertVisible:
    id: "${output.PaymentPage.nameOnCardField}"
    text: "Jan Novák"
