appId: com.ventrata.maestro_booking_demo
env:
  FIRST_NAME: ${FIRST_NAME || "Jan"}
  LAST_NAME: ${LAST_NAME || "Novák"}
  CITY: ${CITY || "Brno"}
  COUNTRY_OPTION_ID: ${COUNTRY_OPTION_ID || "Checkout_CountryOption_cz"}
  STATE_PROVINCE: ${STATE_PROVINCE || "JMK"}
---
# -----------------------------------------------------------------------------
# Subflow: Fill Checkout Contact Details & Terms Checkboxes
# Parameters:
#   FIRST_NAME: First name (default: "Jan")
#   LAST_NAME: Last name (default: "Novák")
#   CITY: City (default: "Brno")
#   COUNTRY_OPTION_ID: Country dropdown option ID (default: "Checkout_CountryOption_cz")
#   STATE_PROVINCE: State or Province (default: "JMK")
# -----------------------------------------------------------------------------

- runScript: ../pages/CheckoutPage.js

- tapOn:
    id: "${output.CheckoutPage.firstNameField}"

- inputText: "${FIRST_NAME}"

- tapOn:
    id: "${output.CheckoutPage.lastNameField}"

- inputText: "${LAST_NAME}"

- scrollUntilVisible:
    element:
        id: "${output.CheckoutPage.cityField}"

- tapOn:
    id: "${output.CheckoutPage.cityField}"

- inputText: "${CITY}"

- scrollUntilVisible:
    element:
        id: "${output.CheckoutPage.countryField}"

- tapOn:
    id: "${output.CheckoutPage.countryField}"

- tapOn:
    id: "${COUNTRY_OPTION_ID}"

- scrollUntilVisible:
    element:
      id: "${output.CheckoutPage.stateProvinceField}"

- tapOn:
    id: "${output.CheckoutPage.stateProvinceField}"

- inputText: "${STATE_PROVINCE}"

- hideKeyboard

- scrollUntilVisible:
    element:
      id: "${output.CheckoutPage.cancellationTermsCheckbox}"

- tapOn:
    id: "${output.CheckoutPage.bookingTermsCheckbox}"

- tapOn:
    id: "${output.CheckoutPage.cancellationTermsCheckbox}"
