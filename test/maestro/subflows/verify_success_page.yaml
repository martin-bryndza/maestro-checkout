appId: com.ventrata.maestro_booking_demo
---
# -----------------------------------------------------------------------------
# Subflow: Verify Order Success Page Details
# -----------------------------------------------------------------------------

- runScript: ../pages/SuccessPage.js

- scrollUntilVisible:
      element:
        id: "${output.SuccessPage.ticketCard}"

- scrollUntilVisible:
      element:
          id: "${output.SuccessPage.freeBadge}"

- scrollUntilVisible:
      element:
          id: "${output.SuccessPage.unitTypeRow('adult')}"

- scrollUntilVisible:
      element:
          id: "${output.SuccessPage.productSummary(0)}"

- scrollUntilVisible:
      element:
          id: "${output.SuccessPage.finalTotal}"

- scrollUntilVisible:
      element:
          id: "${output.SuccessPage.primaryActionButton}"
