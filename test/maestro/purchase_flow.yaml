appId: com.ventrata.maestro_booking_demo
name: Minimal Purchase Flow with Promo Code
tags:
  - smoke
---
# -----------------------------------------------------------------------------
# Maestro Smoke Test: NYC Icons Express Purchase Flow (Happy Path with Promo)
# -----------------------------------------------------------------------------

- runScript: ./pages/CheckoutPage.js
- runScript: ./pages/SuccessPage.js

- launchApp:
    clearState: true

# Step 1: Navigate & select package
- runFlow: subflows/select_package.yaml

# Step 2: Select ticket quantity (1 Adult)
- runFlow:
    file: subflows/select_tickets.yaml
    env:
      ADULT_COUNT: 1

# Step 3: Date & time selection
- runFlow:
    file: subflows/select_date_and_time.yaml
    env:
      CALENDAR_DAY: 15
      TIMESLOT: "12_00"

# Step 4: Fill Questions page
- runFlow:
    file: subflows/fill_questions.yaml
    env:
      ARRIVAL_TEXT: "Přijedu metrem"
      REFERRAL_OPTION: "Od přátel nebo rodiny"
      TICKET_COUNT: 1

# Step 5: Unlock & apply promo code, then fill checkout contact details
- runFlow:
    file: subflows/apply_promo_code.yaml
    env:
      PROMO_CODE: "MAESTROFREE"

- runFlow:
    file: subflows/fill_checkout_contact.yaml
    env:
      FIRST_NAME: "Jan"
      LAST_NAME: "Novák"
      STATE_PROVINCE: "JMK"

# Step 6: Verify promo applied (0.00 EUR total) and confirm order
- assertVisible:
    id: "${output.CheckoutPage.promoAppliedChip}"

- tapOn:
    id: "${output.CheckoutPage.payOrConfirmButton}"

- extendedWaitUntil:
    visible:
      id: "${output.SuccessPage.page}"
    timeout: 15000

# Step 7: Success page verification
- runFlow: subflows/verify_success_page.yaml
