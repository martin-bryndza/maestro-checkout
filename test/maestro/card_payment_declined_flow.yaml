appId: com.ventrata.maestro_booking_demo
name: Minimal Purchase Flow with Invalid Payment Details
tags:
  - regression
---
# -----------------------------------------------------------------------------
# Maestro Flow: Card Payment Declined Flow
# -----------------------------------------------------------------------------

- runScript: ./pages/CheckoutPage.js
- runScript: ./pages/PaymentPage.js

- launchApp:
    clearState: true

- runFlow: subflows/select_package.yaml

- runFlow:
    file: subflows/select_tickets.yaml
    env:
      ADULT_COUNT: 1

- runFlow:
    file: subflows/select_date_and_time.yaml
    env:
      CALENDAR_DAY: 15
      TIMESLOT: "12_00"

- runFlow:
    file: subflows/fill_questions.yaml
    env:
      ARRIVAL_TEXT: "Taxi"
      REFERRAL_OPTION: "Od přátel nebo rodiny"
      TICKET_COUNT: 1

- runFlow:
    file: subflows/fill_checkout_contact.yaml
    env:
      FIRST_NAME: "Eva"
      LAST_NAME: "Svobodová"
      STATE_PROVINCE: "Brno"

# Proceed to Payment Screen (without promo code)
- tapOn:
    id: "${output.CheckoutPage.payOrConfirmButton}"

- extendedWaitUntil:
    visible:
      id: "${output.PaymentPage.page}"
    timeout: 15000

# Fill Card Details
- tapOn:
    id: "${output.PaymentPage.cardNumberField}"

- inputText: "4111111111111111"

- tapOn:
    id: "${output.PaymentPage.expiryField}"

- inputText: "1228"

- tapOn:
    id: "${output.PaymentPage.cvcField}"

- inputText: "123"

- tapOn:
    id: "${output.PaymentPage.payButton}"

# Processing page converts to declined page after 2 seconds
- extendedWaitUntil:
    visible:
      id: "${output.PaymentPage.declinedPage}"
    timeout: 10000

- assertVisible:
    id: "${output.PaymentPage.retryButton}"

# Tapping Retry returns user back to Payment page
- tapOn:
    id: "${output.PaymentPage.retryButton}"

- assertVisible:
    id: "${output.PaymentPage.page}"
